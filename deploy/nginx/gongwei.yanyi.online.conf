server {
    listen 80;
    listen [::]:80;
    server_name gongwei.yanyi.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gongwei.yanyi.online;

    ssl_certificate /etc/letsencrypt/live/gongwei.yanyi.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gongwei.yanyi.online/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # A 10 MiB WAV is sent as base64 JSON; keep the existing backend limit.
    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:18110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
